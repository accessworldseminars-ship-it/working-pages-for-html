
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#1A2744;min-height:100vh;padding:20px}
.wrap{max-width:900px;margin:0 auto;background:#fff;border-radius:12px;padding:28px}
.login-box{max-width:380px;margin:60px auto;text-align:center}
.login-box h1{color:#1A2744;font-size:24px;margin-bottom:6px}
.login-box p{color:#666;margin-bottom:24px}
input[type=email],input[type=password]{width:100%;padding:12px 14px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px;outline:none}
input:focus{border-color:#1D9E75}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:#1D9E75;color:#fff;width:100%;justify-content:center;font-size:15px}
.btn-primary:hover{background:#178a65}
.btn-sm{background:#f1f1f1;color:#444;font-size:13px;padding:7px 14px}
.btn-sm:hover{background:#e5e5e5}
.btn-red{background:#dc3545;color:#fff;font-size:13px;padding:7px 16px}
.btn-red:hover{background:#c82333}
.err{color:#dc3545;font-size:13px;padding:8px 0}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:18px;border-bottom:2px solid #eee}
.hdr h1{color:#1A2744;font-size:22px}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid #eee;padding-bottom:0}
.tab{padding:10px 18px;cursor:pointer;font-size:14px;font-weight:600;color:#888;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all .2s}
.tab.active{color:#1A2744;border-bottom-color:#C9A84C}
.acc-item{margin-bottom:12px;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden}
.acc-hdr{background:#f7f7f7;padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.acc-hdr:hover{background:#efefef}
.acc-hdr-left{display:flex;align-items:center;gap:10px;font-weight:700;color:#1A2744;font-size:16px}
.acc-hdr-right{display:flex;align-items:center;gap:10px}
.badge{background:#1D9E75;color:#fff;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-gold{background:#C9A84C}
.chevron{color:#888;font-size:18px;transition:transform .3s}
.acc-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.acc-body.open{max-height:3000px}
.vid-row{display:flex;align-items:center;padding:11px 18px;border-bottom:1px solid #f0f0f0;cursor:pointer;gap:12px;transition:background .2s}
.vid-row:hover{background:#f5fdf9}
.vid-row:last-child{border-bottom:none}
.vid-row.active{background:#e8f9f1;border-left:4px solid #1D9E75}
.vid-info{flex:1}
.vid-title{font-size:14px;font-weight:600;color:#222}
.vid-desc-short{font-size:12px;color:#888;margin-top:2px}
.vid-meta{display:flex;align-items:center;gap:8px}
.watched-tick{color:#1D9E75;font-size:18px;font-weight:700}
.play-btn{color:#1D9E75;font-size:22px}
.player-wrap{margin-top:20px;background:#f9f9f9;border-radius:10px;padding:20px;border:1px solid #e0e0e0}
.player-wrap h3{color:#1A2744;font-size:17px;margin-bottom:6px}
.player-wrap .desc{color:#555;font-size:14px;line-height:1.6;margin-bottom:14px}
.player-wrap iframe{width:100%;height:420px;border:none;border-radius:8px;background:#000}
.player-actions{display:flex;gap:10px;margin-top:14px;align-items:center}
.mark-watched{background:#1D9E75;color:#fff;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.mark-watched:hover{background:#178a65}
.mark-watched.done{background:#C9A84C}
.close-btn{background:#e0e0e0;color:#555;border:none;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.notes-area{padding:4px 0}
.notes-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.note-card{background:#fffdf5;border:1px solid #e8ddb0;border-radius:8px;padding:14px;margin-bottom:10px}
.note-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.note-title{font-size:13px;font-weight:700;color:#1A2744}
.note-date{font-size:11px;color:#aaa}
.note-body{font-size:13px;color:#444;line-height:1.5;white-space:pre-wrap}
.note-actions{display:flex;gap:6px;margin-top:8px}
.btn-del{background:none;border:1px solid #ddd;color:#999;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.btn-del:hover{background:#fee;color:#c00}
textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;line-height:1.6;resize:vertical;min-height:100px;outline:none;font-family:Arial,sans-serif}
textarea:focus{border-color:#1D9E75}
.note-form{background:#f9f9f9;border:1px solid #eee;border-radius:8px;padding:14px;margin-bottom:16px}
.note-form input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:8px;outline:none}
.note-form input:focus{border-color:#1D9E75}
.empty{text-align:center;color:#aaa;padding:40px 0;font-size:14px}
.progress-bar-wrap{height:6px;background:#eee;border-radius:3px;margin-top:10px;overflow:hidden}
.progress-bar{height:100%;background:#1D9E75;border-radius:3px;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:#f7f7f7;border-radius:10px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:700;color:#1A2744}
.stat-lbl{font-size:12px;color:#888;margin-top:2px}
</style>

<div id="login-section">
  <div class="login-box">
    <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" style="height:60px;margin-bottom:16px" onerror="this.style.display='none'">
    <h1>AccessWorld Seminars</h1>
    <p>Member Portal</p>
    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password">
    <button class="btn btn-primary" onclick="login()">Sign In</button>
    <div id="login-error" class="err"></div>
  </div>
</div>

<div id="dash" style="display:none">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" style="height:40px" onerror="this.style.display='none'">
      <h1>AccessWorld Library</h1>
    </div>
    <button class="btn btn-red" onclick="logout()">Sign Out</button>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">Total videos</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-watched">0</div><div class="stat-lbl">Watched</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-notes">0</div><div class="stat-lbl">Notes saved</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('library',this)">📚 Library</div>
    <div class="tab" onclick="switchTab('notes',this)">📝 My Notes</div>
  </div>

  <div id="tab-library">
    <div id="accordion-container"></div>
    <div id="player" style="display:none">
      <div class="player-wrap">
        <h3 id="player-title"></h3>
        <p class="desc" id="player-desc"></p>
        <iframe id="player-iframe" src="" allowfullscreen></iframe>
        <div class="player-actions">
          <button class="mark-watched" id="mark-btn" onclick="toggleWatched()">✓ Mark as watched</button>
          <button class="close-btn" onclick="closePlayer()">✕ Close</button>
          <span id="watched-label" style="font-size:13px;color:#1D9E75;font-weight:600"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="tab-notes" style="display:none">
    <div class="note-form">
      <input type="text" id="note-title-input" placeholder="Note title (e.g. Emotional Clearing – Session 2)">
      <textarea id="note-body-input" placeholder="Write your notes here — what you learned, where you're up to, key insights..."></textarea>
      <button class="btn btn-primary" style="width:auto;margin-top:8px" onclick="saveNote()">Save Note</button>
    </div>
    <div id="notes-list"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zwwodopezadqjazhajmx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5MjM5OTIsImV4cCI6MjA2MTQ5OTk5Mn0.JHp0lnznVx_y-6rRO2vP4Qyp5ZzH9jELWvLN06M3N8Y";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allLessons = [];
let watched = {};
let notes = [];
let currentVideoId = null;

const CATS = [
  {key:'unlock',      label:'📘 Unlock Your Incredible Self', test: t=> /unlock|incredible/i.test(t)},
  {key:'coaching',    label:'👥 Group Coaching',              test: t=> /coach|group/i.test(t)},
  {key:'emotional',   label:'💚 Emotional Clearing',          test: t=> /emotional|clearing|gift|grey/i.test(t)},
  {key:'morning',     label:'🌅 Morning Routine',             test: t=> /morning|routine/i.test(t)},
  {key:'strategic',   label:'🎯 Strategic Visioning',         test: t=> /strategic|visioning/i.test(t)},
  {key:'nlp',         label:'🧠 NLP Masterclass',             test: t=> /nlp/i.test(t)},
  {key:'intro',       label:'🎓 Free Introductions',          test: t=> /free|introduction|intro/i.test(t)},
  {key:'health',      label:'🏥 Health & Healing',            test: t=> /health/i.test(t)},
  {key:'memory',      label:'📖 Memory Training',             test: t=> /memory/i.test(t)},
  {key:'other',       label:'📁 Other Content',               test: ()=> true},
];

function getCategory(title){
  for(const c of CATS){ if(c.test(title)) return c.label; }
  return '📁 Other Content';
}

function loadLocal(){
  watched = JSON.parse(localStorage.getItem('aw_watched')||'{}');
  notes   = JSON.parse(localStorage.getItem('aw_notes')||'[]');
}
function saveWatched(){ localStorage.setItem('aw_watched', JSON.stringify(watched)); }
function saveNotes(){   localStorage.setItem('aw_notes',   JSON.stringify(notes));   }

async function login(){
  const email = document.getElementById('email').value;
  const pw    = document.getElementById('password').value;
  const err   = document.getElementById('login-error');
  const {data,error} = await sb.auth.signInWithPassword({email, password: pw});
  if(error){ err.innerText = error.message; return; }
  init();
}

async function init(){
  loadLocal();
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('dash').style.display = 'block';
  await loadContent();
  renderNotes();
  updateStats();
}

async function loadContent(){
  const container = document.getElementById('accordion-container');
  container.innerHTML = '<p style="color:#888;padding:20px">Loading your content...</p>';

  const {data,error} = await sb.from('lessons').select('*').eq('tier_required',1).order('sort_order');
  if(error){ container.innerHTML = `<p style="color:red">Error: ${error.message}</p>`; return; }

  allLessons = data || [];

  if(!allLessons.length){ container.innerHTML = '<p style="color:#aaa;padding:20px">No content available yet.</p>'; return; }

  const grouped = {};
  allLessons.forEach(l => {
    const cat = getCategory(l.title);
    if(!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(l);
  });

  let html = '';
  let first = true;
  for(const [cat, lessons] of Object.entries(grouped)){
    const watchedCount = lessons.filter(l => watched[l.id]).length;
    html += `
      <div class="acc-item">
        <div class="acc-hdr" onclick="toggleAcc(this)">
          <div class="acc-hdr-left">
            <span>${cat}</span>
            <span class="badge">${lessons.length}</span>
            ${watchedCount>0?`<span class="badge badge-gold">${watchedCount} watched</span>`:''}
          </div>
          <div class="acc-hdr-right">
            <span class="chevron">${first?'▲':'▼'}</span>
          </div>
        </div>
        <div class="acc-body ${first?'open':''}">
          ${lessons.map(l => buildVideoRow(l)).join('')}
        </div>
      </div>`;
    first = false;
  }
  container.innerHTML = html;
}

function buildVideoRow(l){
  const isWatched = watched[l.id];
  const desc = l.description ? l.description.substring(0,80)+(l.description.length>80?'...':'') : '';
  return `
    <div class="vid-row${currentVideoId===l.id?' active':''}" id="row-${l.id}" onclick="openVideo(${l.id})">
      <div class="vid-info">
        <div class="vid-title">${escHtml(l.title)}</div>
        ${desc?`<div class="vid-desc-short">${escHtml(desc)}</div>`:''}
      </div>
      <div class="vid-meta">
        ${isWatched?`<span class="watched-tick" title="Watched">✓</span>`:''}
        <span class="play-btn">▶</span>
      </div>
    </div>`;
}

function openVideo(id){
  const video = allLessons.find(v => v.id === id);
  if(!video) return;

  currentVideoId = id;

  document.querySelectorAll('.vid-row').forEach(r => r.classList.remove('active'));
  const row = document.getElementById('row-'+id);
  if(row){ row.classList.add('active'); }

  const player = document.getElementById('player');
  document.getElementById('player-title').innerText = video.title;
  document.getElementById('player-desc').innerText = video.description || '';

  const iframe = document.getElementById('player-iframe');
  iframe.src = '';
  setTimeout(()=>{ iframe.src = video.google_drive_embed_url || ''; }, 50);

  const btn = document.getElementById('mark-btn');
  const lbl = document.getElementById('watched-label');
  if(watched[id]){
    btn.textContent = '✓ Watched';
    btn.classList.add('done');
    lbl.textContent = 'You\'ve seen this one!';
  } else {
    btn.textContent = '✓ Mark as watched';
    btn.classList.remove('done');
    lbl.textContent = '';
  }

  player.style.display = 'block';
  player.querySelector('.player-wrap').scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleWatched(){
  if(!currentVideoId) return;
  watched[currentVideoId] = !watched[currentVideoId];
  if(!watched[currentVideoId]) delete watched[currentVideoId];
  saveWatched();

  const btn = document.getElementById('mark-btn');
  const lbl = document.getElementById('watched-label');
  if(watched[currentVideoId]){
    btn.textContent = '✓ Watched';
    btn.classList.add('done');
    lbl.textContent = 'You\'ve seen this one!';
  } else {
    btn.textContent = '✓ Mark as watched';
    btn.classList.remove('done');
    lbl.textContent = '';
  }

  const row = document.getElementById('row-'+currentVideoId);
  if(row){
    const meta = row.querySelector('.vid-meta');
    const existing = meta.querySelector('.watched-tick');
    if(watched[currentVideoId] && !existing){
      const tick = document.createElement('span');
      tick.className = 'watched-tick'; tick.title = 'Watched'; tick.textContent = '✓';
      meta.insertBefore(tick, meta.firstChild);
    } else if(!watched[currentVideoId] && existing){
      existing.remove();
    }
  }

  document.querySelectorAll('.badge-gold').forEach(b => b.remove());
  document.querySelectorAll('.acc-item').forEach(item => {
    const rows = item.querySelectorAll('.vid-row');
    const wCount = Array.from(rows).filter(r => {
      const id = parseInt(r.id.replace('row-',''));
      return watched[id];
    }).length;
    const hdr = item.querySelector('.acc-hdr-left');
    if(wCount>0){
      const badge = document.createElement('span');
      badge.className = 'badge badge-gold';
      badge.textContent = wCount+' watched';
      hdr.appendChild(badge);
    }
  });

  updateStats();
}

function closePlayer(){
  document.getElementById('player').style.display = 'none';
  document.getElementById('player-iframe').src = '';
  document.querySelectorAll('.vid-row').forEach(r => r.classList.remove('active'));
  currentVideoId = null;
}

function toggleAcc(el){
  const body = el.nextElementSibling;
  const chev = el.querySelector('.chevron');
  body.classList.toggle('open');
  chev.textContent = body.classList.contains('open') ? '▲' : '▼';
}

function switchTab(tab, el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-library').style.display = tab==='library'?'block':'none';
  document.getElementById('tab-notes').style.display   = tab==='notes'?'block':'none';
}

function saveNote(){
  const title = document.getElementById('note-title-input').value.trim();
  const body  = document.getElementById('note-body-input').value.trim();
  if(!body){ alert('Please write something before saving.'); return; }
  notes.unshift({id: Date.now(), title: title||'Untitled note', body, date: new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'})});
  saveNotes();
  document.getElementById('note-title-input').value = '';
  document.getElementById('note-body-input').value = '';
  renderNotes();
  updateStats();
}

function deleteNote(id){
  if(!confirm('Delete this note?')) return;
  notes = notes.filter(n => n.id !== id);
  saveNotes();
  renderNotes();
  updateStats();
}

function renderNotes(){
  const list = document.getElementById('notes-list');
  if(!notes.length){
    list.innerHTML = '<div class="empty">No notes yet. Start watching and jot down your insights!</div>';
    return;
  }
  list.innerHTML = notes.map(n => `
    <div class="note-card">
      <div class="note-card-hdr">
        <div class="note-title">${escHtml(n.title)}</div>
        <div class="note-date">${n.date}</div>
      </div>
      <div class="note-body">${escHtml(n.body)}</div>
      <div class="note-actions">
        <button class="btn-del" onclick="deleteNote(${n.id})">Delete</button>
      </div>
    </div>`).join('');
}

function updateStats(){
  document.getElementById('stat-total').textContent   = allLessons.length;
  document.getElementById('stat-watched').textContent = Object.keys(watched).length;
  document.getElementById('stat-notes').textContent   = notes.length;
}

function escHtml(str){
  if(!str) return '';
  return str.replace(/[&<>"']/g, m =>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

window.onload = async () => {
  const {data:{user}} = await sb.auth.getUser();
  if(user) init();
};
</script>
