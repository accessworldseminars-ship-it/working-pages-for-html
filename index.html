<!DOCTYPE html>
<html>
<head>
    <title>AccessWorld Members Area</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; background: #1A2744; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 10px; padding: 20px; }
        input, button { padding: 10px; margin: 5px; }
        button { background: #1D9E75; color: white; border: none; cursor: pointer; }
        .video-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 5px; }
        iframe { width: 100%; height: 300px; border: none; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div id="login">
        <h1>AccessWorld Seminars</h1>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="password" id="password" placeholder="Password"><br>
        <button onclick="doLogin()">Login</button>
        <div id="msg" class="error"></div>
    </div>
    <div id="dashboard" style="display:none">
        <button onclick="doLogout()">Logout</button>
        <h2>Welcome, <span id="user"></span></h2>
        <div id="videos"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://zwwodopezadqjazhajmx.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU5MjM5OTIsImV4cCI6MjA2MTQ5OTk5Mn0.JHp0lnznVx_y-6rRO2vP4Qyp5ZzH9jELWvLN06M3N8Y";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    async function doLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('msg');
        
        msg.innerText = "Logging in...";
        
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
            msg.innerText = error.message;
            return;
        }
        
        document.getElementById('user').innerText = data.user.email;
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        // Load videos
        loadVideos();
    }
    
    async function loadVideos() {
        const videosDiv = document.getElementById('videos');
        videosDiv.innerHTML = "Loading videos...";
        
        const { data, error } = await supabase
            .from('lessons')
            .select('*')
            .order('sort_order');
        
        if (error) {
            videosDiv.innerHTML = "<p class='error'>Error: " + error.message + "</p>";
            console.error(error);
            return;
        }
        
        console.log("Videos found:", data.length);
        
        if (data.length === 0) {
            videosDiv.innerHTML = "<p>No videos found in database.</p>";
            return;
        }
        
        let html = "";
        for (let video of data) {
            if (video.tier_required === 1) {
                html += `
                    <div class="video-card">
                        <h3>${video.title}</h3>
                        <p>${video.description || ''}</p>
                        <iframe src="${video.google_drive_embed_url}"></iframe>
                    </div>
                `;
            }
        }
        
        videosDiv.innerHTML = html || "<p>No Tier 1 videos available.</p>";
    }
    
    async function doLogout() {
        await supabase.auth.signOut();
        location.reload();
    }
    
    // Auto-login if already logged in
    window.onload = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
            document.getElementById('user').innerText = user.email;
            document.getElementById('login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadVideos();
        }
    };
</script>
</body>
</html>
